name: motion_app
description: "Motion Monitoring Flutter App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # 🔔 Notifications
  flutter_local_notifications: ^17.0.0

  # 🌐 API communication
  http: ^1.1.0

  # 🔐 Permission (Android 13+ notifications)
  permission_handler: ^11.3.0

  # iOS style icons (optional)
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true